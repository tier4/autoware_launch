      # - { type: link, link: /hardware/logging_ecu/gpu/002-usage }
      # - { type: link, link: /hardware/logging_ecu/gpu/003-memory }
      # - { type: link, link: /hardware/logging_ecu/gpu/004-throttling }
      # - { type: link, link: /hardware/logging_ecu/gpu/005-frequency }
