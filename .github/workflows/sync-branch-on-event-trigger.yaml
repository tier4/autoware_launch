name: Process Update from Pilot-Auto

on:
  repository_dispatch:
    types: [update-from-pilot-auto]

jobs:
  process-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print Client Payload
        run: |
          echo "Received repository dispatch event from pilot-auto.xx1"
          echo "---------------------------------------------------"
          echo "Event type: ${{ github.event.action }}"
          echo "---------------------------------------------------"
          echo "Client Payload:"
          echo "  latest_tag: ${{ github.event.client_payload.latest_tag }}"
          echo "  branch: ${{ github.event.client_payload.branch }}"
          echo "---------------------------------------------------"

          # Print the entire payload as JSON for debugging
          echo "Full client_payload (JSON):"
          echo '${{ toJSON(github.event.client_payload) }}'
